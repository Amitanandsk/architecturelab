services:

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile

    container_name: order-service

    ports:
      - "8080:8080"

    environment:
      SPRING_APPLICATION_NAME: order-service
      SERVER_PORT: 8080

      # Runtime database access - R2DBC
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/architecture_lab
      SPRING_R2DBC_USERNAME: architecture_user
      SPRING_R2DBC_PASSWORD: architecture_password

      # Flyway migration - JDBC
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/architecture_lab
      SPRING_FLYWAY_USER: architecture_user
      SPRING_FLYWAY_PASSWORD: architecture_password

    depends_on:
      postgres:
        condition: service_healthy


  postgres:
    image: postgres:17-alpine

    container_name: architecturelab-postgres

    environment:
      POSTGRES_DB: architecture_lab
      POSTGRES_USER: architecture_user
      POSTGRES_PASSWORD: architecture_password

    ports:
      - "5432:5432"

    volumes:
      - architecturelab-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U architecture_user -d architecture_lab"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: architecturelab-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

    depends_on:
      - order-service

  grafana:
    image: grafana/grafana:13.2.4
    container_name: architecturelab-grafana

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro

    depends_on:
      - prometheus


volumes:
  architecturelab-postgres-data:
  grafana-data: